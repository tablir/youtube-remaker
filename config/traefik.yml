# traefik.yml
# Traefik static configuration for YouTube Remaker pipeline
# Place at: /data/traefik/traefik.yml

# ============================================
# Global settings
# ============================================
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ============================================
# Logging
# ============================================
log:
  level: WARN
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-599"  # Log errors only — not every request

# ============================================
# API dashboard (disabled in production)
# ============================================
api:
  dashboard: false
  insecure: false

# ============================================
# Entry points
# ============================================
entryPoints:
  web:
    address: ":80"
    # Redirect all HTTP to HTTPS
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt

# NOTE: certificatesResolvers (ACME / Let's Encrypt) is intentionally NOT
# configured here. It is configured exclusively via CLI args in docker-compose.yml
# so that ${ACME_EMAIL} is properly substituted by Docker Compose.
# See: docker-compose.yml → traefik → command section.

# ============================================
# Providers
# ============================================
providers:
  # Docker provider — reads labels from containers
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
