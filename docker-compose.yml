# ============================================
# YouTube Remaker — Docker Compose
# ============================================
# Services:
#   - traefik    : reverse proxy + SSL (Let's Encrypt)
#   - postgres   : database for n8n
#   - n8n        : workflow orchestrator
#   - pipeline   : CLI tools (yt-dlp, ffmpeg, edge-tts, gallery-dl)
#   - whisper    : audio transcription (faster-whisper)
# ============================================

# Global logging config — prevents logs from filling disk
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  proxy:
    external: false
  internal:
    external: false

volumes:
  n8n_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/n8n

  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/postgres

  whisper_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/models/whisper

  pipeline_output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/output

  pipeline_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/cache

  pipeline_temp:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/temp

  pipeline_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/logs

services:

  # ============================================
  # Traefik — Reverse Proxy + SSL
  # ============================================
  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    logging: *default-logging
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Fix for Traefik v3.0 + Docker API v1.40+ compatibility
      # Traefik defaults to API 1.24 which is rejected by Docker 24+
      DOCKER_API_VERSION: "1.41"
      # Cloudflare API token for DNS-01 challenge (Zone:DNS:Edit on serial.tv)
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      # Read-only Docker socket — Traefik only needs to read container labels
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/traefik/acme.json:/acme.json
      - /data/traefik/traefik.yml:/traefik.yml:ro
    command:
      - "--api=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--log.level=WARN"
    labels:
      - "traefik.enable=false"
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================
  # PostgreSQL — Database for n8n
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================
  # n8n — Workflow Orchestrator
  # ============================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    logging: *default-logging
    networks:
      - proxy
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # n8n config
      N8N_HOST: ${N8N_HOST:-ops.serial.tv}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST:-ops.serial.tv}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Basic auth
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      # Timezone
      GENERIC_TIMEZONE: Europe/London
      TZ: Europe/London
      # Execution settings
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
    volumes:
      - n8n_data:/home/node/.n8n
      - pipeline_output:/data/output
      - pipeline_cache:/data/cache
      - pipeline_logs:/data/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_HOST:-ops.serial.tv}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      # IP whitelist — only allow your IP range
      - "traefik.http.middlewares.ipwhitelist.ipallowlist.sourcerange=${ALLOWED_IPS:-92.40.110.0/24}"
      - "traefik.http.routers.n8n.middlewares=ipwhitelist"
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================
  # Pipeline — CLI Tools Container
  # ============================================
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: pipeline
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    environment:
      # AI APIs
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Stock footage APIs
      PEXELS_API_KEY: ${PEXELS_API_KEY}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY}
      STORYBLOCKS_API_KEY: ${STORYBLOCKS_API_KEY}
      # YouTube API
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
      # Pipeline settings
      CLIPS_PER_SECOND: ${CLIPS_PER_SECOND:-4}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-edge-tts}
    volumes:
      - pipeline_output:/data/output
      - pipeline_cache:/data/cache
      - pipeline_temp:/data/temp
      - pipeline_logs:/data/logs
      - whisper_models:/data/models/whisper
      # Mount scripts and templates from repo (read-only)
      - ./scripts:/app/scripts:ro
      - ./templates:/app/templates:ro
      - ./config:/app/config:ro
    command: tail -f /dev/null
    deploy:
      resources:
        limits:
          memory: 6G

  # ============================================
  # Whisper — Audio Transcription
  # ============================================
  whisper:
    build:
      context: .
      dockerfile: Dockerfile.whisper
    container_name: whisper
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_DEVICE: cpu
      WHISPER_LANGUAGE: en
    volumes:
      - whisper_models:/data/models/whisper
      - pipeline_output:/data/output
      - pipeline_temp:/data/temp
    deploy:
      resources:
        limits:
          # medium model needs ~4GB RAM on CPU
          memory: 4G
